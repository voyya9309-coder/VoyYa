<style>
 :root{--v:#FFC400;--vt:#1A1A1A;--s:#FFE58A;--ink:#1A1A1A;--bg:#FFF8E1;--hd:#141414;--rb:16px;--rc:24px;--ri:16px}

 .fade{animation:fd .35s ease both} @keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 .sk{background:linear-gradient(90deg,#0000000d 25%,#0000001f 50%,#0000000d 75%);background-size:200% 100%;animation:sk 1.2s infinite} @keyframes sk{to{background-position:-200% 0}}
 @keyframes bar{from{transform:translateX(-30%)}to{transform:translateX(120%)}}
 #splash{transition:opacity .45s}
 button:active{transform:scale(.97)} button:focus-visible,input:focus-visible{outline:3px solid var(--v);outline-offset:2px}
 .leaflet-container{font-family:inherit}

}

async function subir(file,max=700,keep=false){ // comprime para conexiones lentas; keep=true conserva PNG (transparencia)
  const png=keep&&file.type==='image/png', img=await createImageBitmap(file), s=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
  c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,png?'image/png':'image/jpeg',.72)), n=`${Date.now()}_${Math.random().toString(36).slice(2)}.${png?'png':'jpg'}`;
  const {error}=await sb.storage.from('fotos').upload(n,b,{contentType:png?'image/png':'image/jpeg'}); if(error) throw error;
  return sb.storage.from('fotos').getPublicUrl(n).data.publicUrl;
}
async function subirRaw(file){ const x=(file.name.split('.').pop()||'bin').toLowerCase(), n=`${Date.now()}_${Math.random().toString(36).slice(2)}.${x}`; const {error}=await sb.storage.from('fotos').upload(n,file,{contentType:file.type}); if(error) throw error; return sb.storage.from('fotos').getPublicUrl(n).data.publicUrl; }

function startGPS(me1,pid){ // watchPosition guarda la posición; cada 5 s se sube a Supabase
  if(watchId!==null) return; if(!navigator.geolocation) return toast('Sin GPS en este teléfono');
  watchId=navigator.geolocation.watchPosition(p=>{lastPos=p.coords},()=>toast('Activa el permiso de ubicación'),{enableHighAccuracy:true,maximumAge:5000});
  gpsTimer=setInterval(()=>{ if(!lastPos) return; pt('yo',lastPos.latitude,lastPos.longitude,'Tú','#dc2626');
    sb.from('ubicaciones').upsert({repartidor_id:me1,pedido_id:pid,lat:lastPos.latitude,lng:lastPos.longitude,actualizado:new Date().toISOString()}).then(()=>{}); },5000);
}
function stopGPS(){ if(watchId!==null) navigator.geolocation.clearWatch(watchId); clearInterval(gpsTimer); watchId=null; gpsTimer=null; lastPos=null; }

async function ed(t,id){

  document.getElementById('adm').innerHTML=`<form id="edf" class="${CARD} space-y-2"><h3 class="font-black">Editar (${t})</h3>`+Object.keys(r).filter(k=>k!=='id'&&k!=='creado').map(k=>{
    const v=r[k]; return `<label class="text-xs text-slate-500">${k}`+(typeof v==='boolean'?`<select name="${k}" class="${INP}"><option ${v?'selected':''} value="true">sí</option><option ${!v?'selected':''} value="false">no</option></select>`:`<input name="${k}" value="${e(v!==null&&typeof v==='object'?JSON.stringify(v):v)}" class="${INP}">`)+`</label>`;
  }).join('')+`<div class="flex gap-2"><button class="${BTN} flex-1">Guardar</button><button type="button" onclick="editing=false;vAdmin()" class="${CHIP} flex-1">Cancelar</button></div></form>`;
  document.getElementById('edf').onsubmit=async ev=>{
    ev.preventDefault(); const f=fd(ev.target), o={};
    try{ for(const k in f){ const v=f[k], t0=r[k]; o[k]=typeof t0==='boolean'?v==='true':typeof t0==='number'?(v===''?null:Number(v)):(t0!==null&&typeof t0==='object')?JSON.parse(v):(v===''?null:v); } }catch{ return toast('Formato inválido'); }
    const {error}=await sb.from(t).update(o).eq('id',id); if(error) return toast('Error: '+error.message); editing=false; toast('Guardado'); vAdmin();
  };
}

}
async function subirApk(ev){ ev.preventDefault(); const f=ev.target, b=f.querySelector('button'); b.disabled=true;
  for(const file of f.file.files){ try{ toast('Subiendo '+file.name+'...'); const ruta=Date.now()+'_'+file.name.replace(/[^\w.-]/g,'_');
    const {error}=await sb.storage.from('apks').upload(ruta,file,{contentType:'application/vnd.android.package-archive'}); if(error) throw error;
    const url=sb.storage.from('apks').getPublicUrl(ruta).data.publicUrl;
    const {error:e2}=await sb.from('apks').insert({nombre:(f.nombre.value.trim()&&f.file.files.length===1)?f.nombre.value.trim():file.name.replace(/\.apk$/i,''),version:f.version.value.trim()||null,url,ruta,tamano:file.size}); if(e2) throw e2;
  }catch(er){ toast('Error: '+(er.message||er)); } }
  b.disabled=false; toast('APK subidas ✔'); vAdmin(); }
async function delApk(id,ruta){ if(!confirm('¿Quitar esta APK?')) return; try{ await sb.storage.from('apks').remove([ruta]); }catch{} await sb.from('apks').delete().eq('id',id); toast('APK quitada'); vAdmin(); }

function burbuja(a){ let ya=[]; try{ ya=JSON.parse(localStorage.voyya_av||'[]'); }catch{} if(ya.includes(a.id)||document.querySelector('[data-av="'+a.id+'"]')) return;
  const n=document.querySelectorAll('.avb').length, d=document.createElement('div'); d.className='avb'; d.dataset.av=a.id;
  d.style.cssText='position:fixed;z-index:9998;left:'+Math.max(8,(innerWidth-Math.min(innerWidth*.88,360))/2)+'px;top:'+(76+n*14)+'px;width:min(88vw,360px);touch-action:none;background:linear-gradient(135deg,#FFC400,#fb923c);color:#1a1a1a;border-radius:24px;padding:14px 40px 14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.35);font-size:14px;cursor:grab;user-select:none';
  d.innerHTML='<b style="display:block;margin-bottom:2px">'+e(a.titulo||'📢 Aviso')+'</b><div>'+e(a.mensaje)+'</div><button aria-label="Cerrar" style="position:absolute;top:8px;right:12px;font-size:22px;line-height:1">✕</button>';
  d.querySelector('button').onclick=()=>{ ya.push(a.id); try{ localStorage.voyya_av=JSON.stringify(ya.slice(-60)); }catch{} d.remove(); };
  let ox=0,oy=0,mv=false; d.onpointerdown=ev=>{ if(ev.target.tagName==='BUTTON') return; mv=true; ox=ev.clientX-d.offsetLeft; oy=ev.clientY-d.offsetTop; d.setPointerCapture(ev.pointerId); d.style.cursor='grabbing'; };
  d.onpointermove=ev=>{ if(!mv) return; d.style.left=Math.min(Math.max(0,ev.clientX-ox),innerWidth-60)+'px'; d.style.top=Math.min(Math.max(0,ev.clientY-oy),innerHeight-40)+'px'; }; d.onpointerup=()=>{ mv=false; d.style.cursor='grab'; };
  document.body.appendChild(d); try{ navigator.vibrate&&navigator.vibrate(150); }catch{} }
async function iniciarAvisos(){ try{ const {data}=await sb.from('avisos').select('*').gte('creado',new Date(Date.now()-3*864e5).toISOString()).order('creado'); (data||[]).forEach(burbuja);
  sb.channel('avisos_tr').on('postgres_changes',{event:'INSERT',schema:'public',table:'avisos'},p=>burbuja(p.new)).on('postgres_changes',{event:'DELETE',schema:'public',table:'avisos'},p=>{ const x=p.old&&document.querySelector('[data-av="'+p.old.id+'"]'); x&&x.remove(); }).subscribe(); }catch{} }

    ${col('v',0,'Botones principales')}${col('vt',1,'Texto de los botones')}${col('hd',5,'Cabecera y menú')}${col('bg',4,'Fondo de la página')}

    <div class="flex items-center gap-2 flex-wrap"><label class="${CHIP} cursor-pointer">📷 Imagen de fondo<input type="file" accept="image/*" class="hidden" onchange="subirFondo(this)"></label>${D.fondo_img?`<img src="${e(D.fondo_img)}" class="w-12 h-12 rounded-lg object-cover"><button type="button" onclick="readDF();DW.fondo_img='';redrawDis()" class="${CHIP} text-red-700">Quitar</button>`:''}</div></div></details>
  <details class="${CARD}">${summ('🔘 Forma de botones y tarjetas')}<div class="space-y-2 mt-3">
    <label class="${lab}">Botones${sel('rb',D.rb,[['cuadrado','Cuadrados'],['suave','Suaves'],['redondo','Redondeados'],['pildora','Píldora']])}</label>

  <details class="${CARD}">${summ('📱 Menú de navegación')}<div class="mt-3">
    <label class="${lab} mb-3">Posición${sel('nav_pos',D.nav_pos,[['abajo','Abajo'],['arriba','Arriba']])}</label>
    <p class="text-xs text-slate-500 mb-2">Mueve cada botón con las flechas y cambia su nombre:</p>
    ${ord(D.nav_orden,'nav',k=>`<input name="nt_${k}" value="${e(D.nav_txt[k])}" class="${INP} !py-1.5">`)}
    <label class="${lab}">Nombre del botón de administrador<input name="nt_admin" value="${e(D.nav_txt.admin)}" class="${INP} !py-1.5"></label></div></details>
  <details class="${CARD}">${summ('🏠 Orden de la pantalla de inicio')}<div class="mt-3">${ord(D.home_orden,'home',k=>({hero:'Banner',pedidos:'Mis pedidos',buscar:'Buscador y negocios'}[k]))}</div></details>

    <datalist id="ic">${['shopping-bag','shopping-cart','store','bike','truck','package','shield','message-circle','arrow-left','chevron-right','home','map-pin','navigation','user','phone','star','heart','flame','pizza','coffee','utensils','gift','bell','settings','smile','zap','clock','send','search'].map(n=>`<option value="${n}">`).join('')}</datalist>
    ${ICOS.map(a=>`<div class="flex items-center gap-2 mb-2"><div class="w-10 h-10 rounded-xl bg-hd text-white flex items-center justify-center shrink-0">${ico(a[0],'w-5 h-5',D)}</div><div class="flex-1"><div class="text-xs text-slate-500">${a[1]}</div><input name="i_${a[0]}" list="ic" value="${e(D.ico[a[0]]||'')}" placeholder="${e(a[2])}" class="${INP} !py-1.5"></div>${up(a[0])}</div>`).join('')}

function redrawDis(){ const a=document.getElementById('adm'); if(a&&DW){ a.innerHTML=disH(); lucide.createIcons(); } }

  DW.titulo=x.titulo||'VoyYa'; DW.hero_on=!!x.hero_on; DW.hero_img=!!x.hero_img; DW.hero_titulo=x.hero_titulo||''; DW.hero_sub=x.hero_sub||'';

function mover(key,i,d){ readDF(); const arr=key==='nav'?DW.nav_orden:DW.home_orden, j=i+d; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; redrawDis(); }

/* ---- Actualizar página: probar conexión, guardar y publicar ---- */
const logC=id=>{ const b=document.getElementById(id); if(b) b.innerHTML=''; };
const logA=(id,ic,x)=>{ const b=document.getElementById(id); if(b) b.insertAdjacentHTML('beforeend',`<div>${ic} ${e(x)}</div>`); };
const ghErr=(s,m)=>({401:'el token no es válido o ya venció',403:'el token no tiene permiso (activa Contents: Read and write)',404:'no se encontró: revisa usuario/repositorio y que el token tenga acceso a ese repositorio'}[s]||m||('error '+s));
async function gh(url,tk,opt={}){
  let r; try{ r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+tk,Accept:'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}}); }catch{ throw new Error('no hay conexión con GitHub desde esta red'); }
  const j=await r.json().catch(()=>({})); if(!r.ok){ const er=new Error(ghErr(r.status,j.message)); er.status=r.status; throw er; } return j;
}
async function probarGH(){
  const f=document.getElementById('ghf'), tk=f.tk.value.trim(), repo=f.repo.value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  GHT=null; logC('ghlog'); document.getElementById('ghsave').classList.add('hidden');
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)) return logA('ghlog','❌','Escribe el repositorio como usuario/repositorio (ejemplo: miusuario/voyya)');
  if(!tk) return logA('ghlog','❌','Falta el token de GitHub');
  logA('ghlog','⏳','Conectando con GitHub…');
  try{
    const u=await gh('https://api.github.com/user',tk); logA('ghlog','✅','Token válido (usuario '+u.login+')');
    const r=await gh('https://api.github.com/repos/'+repo,tk); logA('ghlog','✅','Repositorio encontrado · rama principal: '+r.default_branch);
    if(r.permissions&&r.permissions.push===false) throw new Error('el token solo puede leer: activa Contents: Read and write');
    logA('ghlog','✅','Permiso para escribir');
    try{ const c=await gh('https://api.github.com/repos/'+repo+'/contents/index.html',tk); logA('ghlog','✅','index.html encontrado ('+Math.round(c.size/1024)+' KB)'); }catch{ logA('ghlog','⚠️','No hay index.html en el repositorio: se creará al publicar'); }
    try{ const p=await gh('https://api.github.com/repos/'+repo+'/pages',tk); logA('ghlog','✅','GitHub Pages activo: '+p.html_url); }catch{ logA('ghlog','⚠️','No pude confirmar GitHub Pages (revisa Settings → Pages)'); }
    GHT={repo,tk,branch:r.default_branch}; logA('ghlog','🎉','Conexión correcta: ya puedes guardar la configuración'); document.getElementById('ghsave').classList.remove('hidden');
  }catch(er){ logA('ghlog','❌','Error: '+er.message); }
}
function guardarGH(){
  if(!GHT) return; localStorage.voyya_gh=JSON.stringify({repo:GHT.repo,tk:GHT.tk,ok:true});
  const s=document.getElementById('ghst'); s.textContent='✅ Configuración guardada: '+GHT.repo; s.className='text-xs text-green-700 font-bold';
  document.querySelector('#pubf button').disabled=false; document.getElementById('ghsave').classList.add('hidden'); toast('Configuración guardada');
}
async function esperarPagina(len){
  const url=location.origin+location.pathname;
  for(let i=1;i<=20;i++){ await new Promise(r=>setTimeout(r,6000)); try{ const x=await (await fetch(url+'?nc='+Date.now(),{cache:'no-store'})).text(); if(x.length===len) return true; }catch{} }
  return false;
}
async function subirPagina(ev){
  ev.preventDefault(); const g=JSON.parse(localStorage.voyya_gh||'null'), file=ev.target.file.files[0], b=ev.target.querySelector('button'); logC('publog');
  if(!g||!g.ok) return logA('publog','❌','Primero prueba y guarda la conexión.'); if(!file) return logA('publog','❌','Elige el archivo index.html');
  const txt=await file.text(); if(!txt.includes('VoyYa')&&!confirm('Este archivo no parece ser VoyYa. ¿Publicar igual?')) return;
  b.disabled=true;
  try{
    logA('publog','✅','Archivo leído ('+Math.round(file.size/1024)+' KB)');
    const api='https://api.github.com/repos/'+g.repo+'/contents/index.html'; let sha;
    try{ sha=(await gh(api,g.tk)).sha; logA('publog','✅','Versión actual encontrada'); }catch(er){ if(er.status!==404) throw er; }
    const u8=new Uint8Array(await file.arrayBuffer()); let bin=''; for(let i=0;i<u8.length;i+=8192) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));
    const r=await gh(api,g.tk,{method:'PUT',body:JSON.stringify({message:'Actualización desde el panel de VoyYa',content:btoa(bin),sha})});
    logA('publog','✅','Subido a GitHub (commit '+r.commit.sha.slice(0,7)+')');
    logA('publog','⏳','Esperando a que GitHub Pages la publique (1–2 min)…');
    const ok=await esperarPagina(txt.length);
    logA('publog',ok?'🎉':'⚠️',ok?'La nueva versión ya está en línea. Recarga la página.':'Aún no se ve; puede tardar unos minutos más. Recarga luego.');
  }catch(er){ logA('publog','❌','Error: '+er.message); }
  b.disabled=false;
}
async function probarDB(){
  logC('dblog'); logA('dblog','⏳','Probando…'); let ok=true;
  for(const tb of ['usuarios','negocios','productos','pedidos','ubicaciones','recargas','soporte','config','presencia']){
    const {count,error}=await sb.from(tb).select('*',{count:'exact',head:true}); if(error){ ok=false; logA('dblog','❌',tb+': '+error.message); } else logA('dblog','✅',tb+' ('+count+' filas)');
  }
  const st=await sb.storage.from('fotos').list('',{limit:1}); if(st.error){ ok=false; logA('dblog','❌','Fotos: '+st.error.message); } else logA('dblog','✅','Almacén de fotos listo');
  const rt=await new Promise(res=>{ const ch=sb.channel('t'+Math.random()), tm=setTimeout(()=>{ sb.removeChannel(ch); res(false); },6000);
    ch.subscribe(s=>{ if(s==='SUBSCRIBED'){ clearTimeout(tm); sb.removeChannel(ch); res(true); } else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'){ clearTimeout(tm); sb.removeChannel(ch); res(false); } }); });
  if(!rt) ok=false; logA('dblog',rt?'✅':'❌','Tiempo real '+(rt?'conectado':'sin conexión'));
  logA('dblog',ok?'🎉':'⚠️',ok?'Todo conectado y funcionando':'Hay problemas: si falta alguna tabla, ejecuta el SQL.');
}
