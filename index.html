<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E7C66">
<title>VoyYa · Delivery en Sancti Spíritus</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{v:'var(--v)',s:'var(--s)',ink:'var(--ink)'}}}}</script>
<style>
 :root{--v:#087f68;--s:#ffc928;--ink:#10231f;--bg:#f2f7f5}
 *{box-sizing:border-box}
 body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
 #splash{transition:opacity .4s} header{box-shadow:0 8px 24px #062f251c} #app{min-height:65vh}
 .bg-v{background:var(--v)!important}.text-v{color:var(--v)!important}.bg-s{background:var(--s)!important}
 .rounded-2xl{border-radius:1.25rem}.shadow-sm{box-shadow:0 5px 18px #12352b0b}.border-slate-200{border-color:#e4ece8}
 button{transition:transform .15s ease,filter .15s ease,box-shadow .15s ease}button:active{transform:scale(.98)}
 button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--s);outline-offset:2px}
 input,textarea,select{max-width:100%}
 .hero-voyya{background:radial-gradient(circle at 90% 5%,#ffffff3d,transparent 34%),linear-gradient(135deg,var(--v),#075b4d);color:white;border-radius:1.5rem;padding:1.35rem;box-shadow:0 12px 30px #087f6826}
 .product-photo{background:linear-gradient(135deg,#edf5f1,#fff)}.safe-area-bottom{padding-bottom:env(safe-area-inset-bottom)}
 @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
 </style>
</head>
<body>
<!-- Pantalla de carga: sube tu imagen al repositorio con el nombre splash.png -->
<div id="splash" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center gap-4">
  <img src="splash.png" alt="VoyYa" class="max-w-[80%] max-h-[60%] object-contain" onerror="this.style.display='none';document.getElementById('sl').style.display='block'">
  <div id="sl" class="hidden text-5xl font-black text-[#0E7C66]">Voy<span class="text-[#FFC21A]">Ya</span></div>
  <div class="w-40 h-1.5 bg-slate-200 rounded-full overflow-hidden"><div class="h-full w-1/2 bg-[#0E7C66] rounded-full animate-pulse"></div></div>
</div>

<header class="sticky top-0 z-20 bg-v text-white">
  <div class="max-w-xl mx-auto px-4 pt-3 flex items-center justify-between">
    <h1 class="text-2xl font-black tracking-tight flex items-center gap-2"><span class="inline-flex w-9 h-9 rounded-xl bg-white/15 items-center justify-center">🛵</span>Voy<span class="text-s">Ya</span></h1>
    <div id="hr" class="flex items-center gap-2"></div>
  </div>
  <nav id="nav" class="max-w-xl mx-auto px-2 flex text-sm font-semibold"></nav>
</header>
<div id="ban" class="max-w-xl mx-auto px-4 pt-3 empty:hidden"></div>
<main id="app" class="max-w-xl mx-auto p-4 pb-28"></main>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-ink text-white text-sm rounded-full px-4 py-2 hidden z-50"></div>
<!-- Acceso invisible al panel de administrador (esquina inferior derecha) -->
<button onclick="admin()" aria-label="." class="fixed bottom-0 right-0 w-14 h-14 opacity-0 z-40"></button>

<script>
/* ============ CONFIGURACIÓN ============ */
const SUPABASE_URL = 'https://efxosdwucdkvveymvuxq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_x5rb1Xpe8-GM074IfvNRqg_tvWEm1RA';
const ADMIN_PASS = '93091414047';
/* ======================================= */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cup = n => Number(n||0).toLocaleString('es') + ' CUP';
const fd = f => Object.fromEntries(new FormData(f));
const L = {pendiente:'Recibido',preparando:'En preparación',listo:'Listo, buscando repartidor',en_camino:'En camino',entregado:'Entregado',rechazado:'Rechazado'};
const BTN='bg-v text-white rounded-xl px-4 py-2.5 font-semibold active:scale-95 disabled:opacity-50', BTN2='bg-s text-ink rounded-xl px-4 py-2.5 font-bold active:scale-95';
const INP='w-full border border-slate-300 rounded-xl px-3 py-2.5 bg-white text-slate-900', CARD='bg-white rounded-2xl p-4 shadow-sm border border-slate-200 text-slate-900', CHIP='px-3 py-1.5 rounded-lg border text-sm active:scale-95';
const TEMAS = {verde:['#0E7C66','#FFC21A','#10231F','#F3F7F5'],azul:['#1D4ED8','#FACC15','#0F172A','#EFF4FF'],naranja:['#EA580C','#FDE047','#1C1917','#FFF7ED'],rosa:['#DB2777','#FDE047','#27111C','#FFF1F7'],morado:['#6D28D9','#FBBF24','#1E1B4B','#F5F3FF']};
const CFG = {tarifa_km:'150',comision:'10',tarjeta:'',telefono:'',aviso:'',tema:'verde'};

let tab='cliente', chans=[], NEGS=[], neg=null, prods=[], cart={nid:null,items:{}}, M=null, U=null, ADM=false, asec='Resumen', editing=false, CK={lat:null,lng:null,dir:''};
let watchId=null, gpsTimer=null, lastPos=null, shownAct=null, nSub='pedidos', admTm=null;

const toast = m => { const t=document.getElementById('toast'); t.textContent=m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2800); };
const icons = () => lucide.createIcons();
const fail = er => { console.error('[VoyYa]',er); app.innerHTML=`<div class="${CARD} border-red-200 text-red-700"><b class="block mb-1">No se pudo completar la operación</b><p class="text-sm">${e(er?.message||er||'Error desconocido')}</p><p class="text-xs text-slate-500 mt-2">Comprueba tu conexión y la configuración de Supabase. No ejecutes un SQL que borre tablas si ya tienes datos.</p><button onclick="render()" class="${BTN} mt-3">Reintentar</button></div>`; };
function unsub(){ chans.forEach(c=>sb.removeChannel(c)); chans=[]; if(M){ try{M.map.remove()}catch{} M=null; } }
function listen(name,table,filter,fn){ const c={event:'*',schema:'public',table}; if(filter)c.filter=filter; chans.push(sb.channel(name+Math.random()).on('postgres_changes',c,fn).subscribe()); }
const dist=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const online = u => u.ultimo_visto && Date.now()-new Date(u.ultimo_visto) < 75000;
const dot = on => `<span class="inline-block w-2.5 h-2.5 rounded-full ${on?'bg-green-500':'bg-slate-400'}"></span>`;
const gps = (ok,bad) => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p=>ok(p.coords),()=>toast('Activa el permiso de ubicación'),{enableHighAccuracy:true,timeout:15000}) : toast('Sin GPS en este teléfono');

/* ---------- Configuración global y temas (en tiempo real) ---------- */
async function loadCfg(){
  const {data}=await sb.from('config').select('*'); (data||[]).forEach(r=>CFG[r.clave]=r.valor);
  const t=TEMAS[CFG.tema]||TEMAS.verde, s=document.documentElement.style;
  s.setProperty('--v',t[0]); s.setProperty('--s',t[1]); s.setProperty('--ink',t[2]); s.setProperty('--bg',t[3]);
  document.getElementById('ban').innerHTML = CFG.aviso ? `<div class="bg-s text-ink rounded-xl px-3 py-2 text-sm font-semibold">📢 ${e(CFG.aviso)}</div>` : '';
}
sb.channel('cfg').on('postgres_changes',{event:'*',schema:'public',table:'config'},loadCfg).subscribe();

/* ---------- Sesión ---------- */
async function me(){
  const id=localStorage.voyya_u; if(!id){U=null;return}
  const {data}=await sb.from('usuarios').select('*').eq('id',id).maybeSingle();
  if(!data||data.baneado){ localStorage.removeItem('voyya_u'); U=null; if(data?.baneado) toast('Tu cuenta fue suspendida'); return; }
  U=data;
}
async function hb(){ // latido: marca "conectado" cada 30 s y expulsa cuentas baneadas
  if(!U) return;
  const {data}=await sb.from('usuarios').update({ultimo_visto:new Date().toISOString()}).eq('id',U.id).select('baneado').maybeSingle();
  if(!data||data.baneado){ localStorage.removeItem('voyya_u'); U=null; toast('Tu cuenta fue suspendida'); render(); }
}
function salir(){ localStorage.removeItem('voyya_u'); stopGPS(); U=null; go('cliente'); }
function head(){ document.getElementById('hr').innerHTML=(U?`<span class="text-xs opacity-80">${e(U.nombre)}</span><button onclick="salir()" class="text-xs underline">Salir</button>`:'')+`<button onclick="U?go('soporte'):toast('Inicia sesión para escribir a soporte')" class="p-2" aria-label="Soporte"><i data-lucide="message-circle" class="w-5 h-5"></i></button>`; }

/* ---------- Registro / acceso (nombre, apellido, teléfono, tarjeta) ---------- */
function auth(rol,done){
  let reg=false; const R={cliente:'Cliente',negocio:'Dueño de negocio',repartidor:'Repartidor'};
  const draw=()=>{
    app.innerHTML=`<form class="${CARD} space-y-3"><h2 class="font-bold text-lg">${reg?'Crear cuenta':'Entrar'} · ${R[rol]}</h2>`+
    (reg?`<input name="nombre" required placeholder="Nombre" class="${INP}"><input name="apellido" required placeholder="Apellido" class="${INP}">`:'')+
    `<input name="telefono" required inputmode="tel" placeholder="Número de teléfono" class="${INP}">`+
    (reg?`<input name="tarjeta" required inputmode="numeric" placeholder="Número de tarjeta" class="${INP}">`:'')+
    `<input name="clave" required type="password" placeholder="Clave (mínimo 4 caracteres)" class="${INP}">`+
    (reg&&rol==='negocio'?`<input name="negocio" required placeholder="Nombre del negocio" class="${INP}"><input name="categoria" placeholder="Categoría (pizzería, cafetería...)" class="${INP}"><input name="emoji" placeholder="Emoji 🍕" class="${INP}">`:'')+
    `<button class="${BTN} w-full">${reg?'Registrarme':'Entrar'}</button><button type="button" id="sw" class="text-sm underline text-slate-500 w-full">${reg?'Ya tengo cuenta':'No tengo cuenta: registrarme'}</button></form>`;
    app.querySelector('#sw').onclick=()=>{reg=!reg;draw()};
    app.querySelector('form').onsubmit=async ev=>{
      ev.preventDefault(); const f=fd(ev.target), tel=f.telefono.replace(/\D/g,''); let u;
      if(reg){
        const tj=f.tarjeta.replace(/\D/g,''); if(tel.length<8||tj.length<12||f.clave.length<4) return toast('Revisa teléfono, tarjeta (12+ dígitos) y clave');
        const {data,error}=await sb.from('usuarios').insert({rol,nombre:f.nombre.trim(),apellido:f.apellido.trim(),telefono:tel,tarjeta:tj,clave:f.clave}).select().single();
        if(error) return toast('Ese teléfono ya está registrado o no puede registrarse'); u=data;
        if(rol==='negocio') await sb.from('negocios').insert({dueno_id:u.id,nombre:f.negocio,categoria:f.categoria||'Tienda',emoji:f.emoji||'🏪'});
      } else {
        const {data}=await sb.from('usuarios').select('*').eq('telefono',tel).eq('clave',f.clave).maybeSingle();
        if(!data) return toast('Teléfono o clave incorrectos');
        if(data.baneado) return toast('Tu cuenta fue suspendida');
        if(rol!=='cliente'&&data.rol!==rol) return toast('Esta cuenta es de '+data.rol); u=data;
      }
      localStorage.voyya_u=u.id; U=u; hb(); done();
    };
  }; draw();
}

/* ---------- Navegación ---------- */
function go(t){ tab=t; unsub(); neg=null; shownAct=null; render(); }
async function render(){
  try{
    await me(); head();
    const T=ADM?[['admin','Administración']]:[['cliente','Explorar'],['negocio','Mi negocio'],['repartidor','Repartidor']];
    document.getElementById('nav').innerHTML=T.map(([k,n])=>`<button onclick="go('${k}')" class="flex-1 py-3 border-b-4 ${tab===k?'border-s':'border-transparent opacity-75'}">${n}</button>`).join('');
    await ({cliente:vCliente,negocio:vNegocio,repartidor:vRepartidor,soporte:vSoporte,admin:vAdmin})[tab](); icons();
  }catch(er){fail(er)}
}

/* ---------- Mapa (Leaflet + OpenStreetMap) ---------- */
function mk(id){
  const map=L.map(id).setView([21.9322,-79.4428],12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  return {map,m:{},n:0};
}
function pt(k,lat,lng,label,color){
  if(!M||lat==null||lng==null) return;
  if(M.m[k]) M.m[k].setLatLng([lat,lng]);
  else M.m[k]=L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).addTo(M.map).bindTooltip(label,{permanent:true,direction:'top'});
  const g=Object.values(M.m).map(x=>x.getLatLng());
  if(g.length!==M.n){ M.n=g.length; g.length>1?M.map.fitBounds(L.latLngBounds(g),{padding:[40,40]}):M.map.setView(g[0],15); }
}

/* =================== CLIENTE =================== */
async function vCliente(){
  if(localStorage.voyya_ped) return track(localStorage.voyya_ped);
  const load=async()=>{
    const {data,error}=await sb.from('negocios').select('*').eq('activo',true).order('nombre'); if(error) return fail(error);
    NEGS=data; if(neg||tab!=='cliente') return;
    app.innerHTML=`<section class="hero-voyya mb-4"><div class="text-sm font-semibold opacity-90">DELIVERY LOCAL · SANCTI SPÍRITUS</div><h2 class="text-2xl font-black mt-1">¿Qué te llevamos hoy?</h2><p class="text-sm opacity-90 mt-1">Tus comercios favoritos, a un toque de distancia.</p></section><input id="buscarNeg" class="${INP} mb-3" placeholder="🔎 Buscar tienda, cafetería, comida..." autocomplete="off"><div id="listaNeg">`+(data.length?data.map(n=>`<button onclick="openNeg('${n.id}')" data-search="${e((n.nombre+' '+n.categoria).toLowerCase())}" class="${CARD} w-full flex items-center gap-4 mb-3 text-left"><span class="w-14 h-14 rounded-2xl bg-emerald-50 flex items-center justify-center text-3xl">${e(n.emoji)}</span><span class="flex-1 min-w-0"><b class="block text-base">${e(n.nombre)}</b><span class="text-slate-500 text-sm">${e(n.categoria)}</span></span><span class="text-v text-xl">›</span></button>`).join(''):`<div class="${CARD} text-center py-8"><div class="text-4xl mb-2">🛵</div><b>Aún no hay negocios disponibles</b><p class="text-sm text-slate-500 mt-1">Vuelve pronto, estamos preparando la oferta local.</p></div>`)+`</div>`;
     const search=document.getElementById('buscarNeg'); if(search) search.oninput=()=>{const q=search.value.toLowerCase().trim();document.querySelectorAll('#listaNeg [data-search]').forEach(x=>x.classList.toggle('hidden',!x.dataset.search.includes(q)));};
  };
  unsub(); listen('cn','negocios',null,load); load();
}
async function openNeg(id){
  neg=NEGS.find(n=>n.id==id); if(cart.nid!=id) cart={nid:id,items:{}};
  const load=async()=>{ const {data,error}=await sb.from('productos').select('*').eq('negocio_id',id).eq('disponible',true).order('nombre'); if(error) return fail(error); prods=data; if(tab==='cliente'&&neg&&!CK.out) drawNeg(); };
  unsub(); listen('pr','productos',`negocio_id=eq.${id}`,load); load();
}
const cartTotal=()=>Object.values(cart.items).reduce((s,i)=>s+i.q*i.p.precio,0), cartCount=()=>Object.values(cart.items).reduce((s,i)=>s+i.q,0);
function chg(pid,d){ const p=prods.find(x=>x.id==pid), it=cart.items[pid]||{p,q:0}; it.q=Math.max(0,it.q+d); it.q?cart.items[pid]=it:delete cart.items[pid]; drawNeg(); }
function drawNeg(){
  CK.out=false;
  app.innerHTML=`<button onclick="go('cliente')" class="font-semibold mb-3 text-v">← Negocios</button><section class="hero-voyya mb-4"><div class="text-3xl mb-1">${e(neg.emoji)}</div><h2 class="text-xl font-black">${e(neg.nombre)}</h2><p class="text-sm opacity-90">Explora el menú y añade tus productos al pedido.</p></section><input id="buscarProd" class="${INP} mb-3" placeholder="🔎 Buscar en el menú..." autocomplete="off">`+
  (prods.length?`<div id="listaProd">`+prods.map(p=>{const q=cart.items[p.id]?.q||0;return `<div data-search="${e(p.nombre.toLowerCase())}" class="${CARD} mb-3 flex items-center gap-3">
    ${p.foto?`<img src="${e(p.foto)}" loading="lazy" class="w-20 h-20 rounded-xl object-cover product-photo">`:`<div class="w-20 h-20 rounded-xl product-photo flex items-center justify-center text-3xl">${e(neg.emoji)}</div>`}
    <div class="flex-1 min-w-0"><b class="block">${e(p.nombre)}</b><div class="text-v font-extrabold mt-1">${cup(p.precio)}</div></div>
    <div class="flex items-center gap-2">${q?`<button onclick="chg('${p.id}',-1)" class="w-9 h-9 rounded-full bg-slate-100 font-bold">−</button><b>${q}</b>`:''}<button onclick="chg('${p.id}',1)" aria-label="Añadir ${e(p.nombre)}" class="w-10 h-10 rounded-full bg-v text-white font-bold shadow">+</button></div></div>`}).join('')+`</div>`:`<div class="${CARD} text-center py-8"><div class="text-4xl mb-2">🍽️</div><b>Menú sin productos disponibles</b><p class="text-sm text-slate-500 mt-1">Este negocio todavía no ha publicado productos.</p></div>`)+
  (cartCount()?`<div class="fixed bottom-0 inset-x-0 p-3 bg-white/95 backdrop-blur border-t z-30 safe-area-bottom"><div class="max-w-xl mx-auto"><button onclick="drawCheckout()" class="${BTN} w-full shadow-lg">🛒 Ver pedido · ${cartCount()} · ${cup(cartTotal())}</button></div></div>`:'');
  const ps=document.getElementById('buscarProd'); if(ps) ps.oninput=()=>{const q=ps.value.toLowerCase().trim();document.querySelectorAll('#listaProd [data-search]').forEach(x=>x.classList.toggle('hidden',!x.dataset.search.includes(q)));};
}
function drawCheckout(){
  CK.out=true;
  if(!U) return auth('cliente',drawCheckout);
  const km=(CK.lat!=null&&neg.lat!=null)?dist(neg.lat,neg.lng,CK.lat,CK.lng):null, envio=km==null?0:Math.round(km*Number(CFG.tarifa_km)), sub=cartTotal();
  app.innerHTML=`<button onclick="drawNeg()" class="font-semibold mb-3 text-v">← Volver</button><h2 class="text-xl font-bold mb-3">Tu pedido</h2>
  <div class="${CARD} mb-3">${Object.values(cart.items).map(i=>`<div class="flex justify-between"><span>${i.q} × ${e(i.p.nombre)}</span><span>${cup(i.q*i.p.precio)}</span></div>`).join('')}
  <div class="flex justify-between border-t mt-2 pt-2"><span>Productos</span><span>${cup(sub)}</span></div>
  <div class="flex justify-between"><span>Servicio a domicilio${km!=null?` (${km.toFixed(1)} km)`:''}</span><span>${km!=null?cup(envio):'se calcula con tu GPS'}</span></div>
  <div class="flex justify-between font-bold text-lg"><span>Total</span><span>${cup(sub+envio)}</span></div>
  ${km==null&&neg.lat==null?`<p class="text-xs text-slate-500 mt-1">Este negocio aún no fijó su ubicación: el envío se acuerda con el repartidor.</p>`:''}</div>
  <form onsubmit="sendOrder(event,${envio},${km==null?'null':km})" class="space-y-3">
    <input name="dir" required oninput="CK.dir=this.value" value="${e(CK.dir)}" placeholder="Dirección con detalles (calle, número, referencias)" class="${INP}">
    <button type="button" onclick="gps(c=>{CK.lat=c.latitude;CK.lng=c.longitude;drawCheckout()})" class="${BTN2} w-full">📍 ${CK.lat!=null?'Ubicación enviada ✓ (actualizar)':'Enviar mi ubicación GPS'}</button>
    <button class="${BTN} w-full">Confirmar pedido</button></form>`;
}
async function sendOrder(ev,envio,km){
  ev.preventDefault(); const b=ev.target.querySelector('button:last-child'); if(b.disabled)return; b.disabled=true; const sub=cartTotal(); if(!U||!neg||!cartCount()){b.disabled=false;return toast('Tu sesión o carrito no está disponible');}
  const items=Object.values(cart.items).map(i=>({n:i.p.nombre,q:i.q,p:i.p.precio}));
  const {data,error}=await sb.from('pedidos').insert({cliente_id:U.id,negocio_id:neg.id,cliente_nombre:U.nombre+' '+U.apellido,cliente_tel:U.telefono,direccion:fd(ev.target).dir,lat:CK.lat,lng:CK.lng,items,subtotal:sub,envio,distancia_km:km==null?null:+km.toFixed(2),total:sub+envio,estado:'pendiente'}).select().single();
  if(error){ b.disabled=false; console.error(error); return toast('No se envió: '+error.message); }
  localStorage.voyya_ped=data.id; cart={nid:null,items:{}}; CK={lat:null,lng:null,dir:''}; neg=null; render();
}
async function track(id){
  unsub(); app.innerHTML=`<div id="info"></div><div id="map" class="h-72 rounded-2xl mt-3 border border-slate-200"></div>`; M=mk('map'); let locRep=null;
  const load=async()=>{
    const {data:p}=await sb.from('pedidos').select('*, negocios(nombre,lat,lng)').eq('id',id).maybeSingle();
    if(!p){ localStorage.removeItem('voyya_ped'); return render(); }
    const steps=[['pendiente','Recibido'],['preparando','En preparación'],['en_camino','En camino'],['entregado','Entregado']];
    const idx=Math.max(0,steps.findIndex(s=>s[0]===(p.estado==='listo'?'preparando':p.estado))), done=['entregado','rechazado'].includes(p.estado);
    const info=document.getElementById('info'); if(!info) return;
    info.innerHTML=`<h2 class="text-xl font-bold mb-1">Tu pedido en ${e(p.negocios?.nombre)}</h2>

const setEst=async(id,est)=>{const {error}=await sb.from('pedidos').update({estado:est}).eq('id',id);if(error)return toast('No se pudo actualizar: '+error.message);toast('Pedido actualizado');};
function setLoc(id){ gps(async c=>{const {error}=await sb.from('negocios').update({lat:c.latitude,lng:c.longitude}).eq('id',id);if(error)return toast('No se pudo guardar la ubicación');toast('Ubicación guardada');render();}); }
async function subir(file){
  if(!file||!file.type.startsWith('image/')) throw new Error('Selecciona una imagen válida');
  let blob=file;
  if(window.createImageBitmap){
    const img=await createImageBitmap(file), scale=Math.min(1,800/Math.max(img.width,img.height)), c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    blob=await new Promise((resolve,reject)=>c.toBlob(x=>x?resolve(x):reject(new Error('No se pudo procesar la imagen')),'image/jpeg',.76));
  }
  const name=`${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
  const {error}=await sb.storage.from('fotos').upload(name,blob,{contentType:'image/jpeg',upsert:false}); if(error) throw error;
  return sb.storage.from('fotos').getPublicUrl(name).data.publicUrl;
}
async function addProd(ev,nid){
  ev.preventDefault(); const form=ev.target, b=form.querySelector('button'); b.disabled=true;
  try{
    const nombre=form.nombre.value.trim(), precio=Number(form.precio.value);
    if(!nombre||!Number.isFinite(precio)||precio<0) throw new Error('Revisa el nombre y el precio');
    let foto=null; const file=form.foto.files[0]; if(file) foto=await subir(file);
    const {error}=await sb.from('productos').insert({negocio_id:nid,nombre,precio,foto});
    if(error) throw error;
    toast('Producto añadido correctamente'); form.reset(); await render();
  }catch(er){toast('No se pudo añadir: '+(er.message||'error'));b.disabled=false}
}

async function confirmarCompra(m){
  await sb.from('recargas').insert({repartidor_id:U.id,nombre:U.nombre+' '+U.apellido,telefono:U.telefono,monto:m});
  let n=(CFG.telefono||'').replace(/\D/g,''); if(n.length===8) n='53'+n;
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(`Hola, quiero el paquete de ${m} CUP de VoyYa. Soy ${U.nombre} ${U.apellido}, tel ${U.telefono}. Ya hice la transferencia.`)}`,'_blank');

async function tomar(id,saldo){
  if(saldo<Number(CFG.comision)) return toast('Saldo insuficiente: compra un paquete');
  const {data}=await sb.from('pedidos').update({repartidor_id:U.id,estado:'en_camino'}).eq('id',id).eq('estado','listo').is('repartidor_id',null).select();
  if(!data?.length) toast('Otro repartidor ya lo tomó');
}
async function entregar(id){
  const {data}=await sb.from('pedidos').update({estado:'entregado'}).eq('id',id).eq('estado','en_camino').select();
  if(data?.length){ const {data:u}=await sb.from('usuarios').select('saldo').eq('id',U.id).single(); await sb.from('usuarios').update({saldo:Math.max(0,(u.saldo||0)-Number(CFG.comision))}).eq('id',U.id); }
  stopGPS(); await sb.from('ubicaciones').delete().eq('repartidor_id',U.id); shownAct=null;
}
function startGPS(me,pid){ // watchPosition guarda la posición; cada 5 s se sube a Supabase
  if(watchId!==null) return; if(!navigator.geolocation) return toast('Sin GPS en este teléfono');
  watchId=navigator.geolocation.watchPosition(p=>{lastPos=p.coords},()=>toast('Activa el permiso de ubicación'),{enableHighAccuracy:true,maximumAge:5000});
  gpsTimer=setInterval(()=>{ if(!lastPos) return; pt('yo',lastPos.latitude,lastPos.longitude,'Tú','#dc2626');
    sb.from('ubicaciones').upsert({repartidor_id:me,pedido_id:pid,lat:lastPos.latitude,lng:lastPos.longitude,actualizado:new Date().toISOString()}); },5000);
}
function stopGPS(){ if(watchId!==null) navigator.geolocation.clearWatch(watchId); clearInterval(gpsTimer); watchId=null; gpsTimer=null; lastPos=null; }

/* Editor genérico: cualquier campo de cualquier fila */
async function ed(t,id){
  const {data:r}=await sb.from(t).select('*').eq('id',id).single(); if(!r) return; editing=true;
  document.getElementById('adm').innerHTML=`<form id="edf" class="${CARD} space-y-2"><h3 class="font-bold">Editar (${t})</h3>`+Object.keys(r).filter(k=>k!=='id'&&k!=='creado').map(k=>{
    const v=r[k]; return `<label class="text-xs text-slate-500">${k}`+(typeof v==='boolean'?`<select name="${k}" class="${INP}"><option ${v?'selected':''} value="true">sí</option><option ${!v?'selected':''} value="false">no</option></select>`:`<input name="${k}" value="${e(v!==null&&typeof v==='object'?JSON.stringify(v):v)}" class="${INP}">`)+`</label>`;
  }).join('')+`<div class="flex gap-2"><button class="${BTN} flex-1">Guardar</button><button type="button" onclick="editing=false;vAdmin()" class="${CHIP} flex-1">Cancelar</button></div></form>`;
  document.getElementById('edf').onsubmit=async ev=>{
    ev.preventDefault(); const f=fd(ev.target), o={};
    try{ for(const k in f){ const v=f[k], t0=r[k]; o[k]=typeof t0==='boolean'?v==='true':typeof t0==='number'?(v===''?null:Number(v)):(t0!==null&&typeof t0==='object')?JSON.parse(v):(v===''?null:v); } }catch{ return toast('Formato inválido'); }
    const {error}=await sb.from(t).update(o).eq('id',id); if(error) return toast('Error: '+error.message); editing=false; vAdmin();
  };
}
async function del(t,id){ if(confirm('¿Eliminar definitivamente?')){ const {error}=await sb.from(t).delete().eq('id',id); if(error) toast(error.message); vAdmin(); } }
async function ban(id,v){ await sb.from('usuarios').update({baneado:v}).eq('id',id); vAdmin(); }
async function sal(id,m){ const {data:u}=await sb.from('usuarios').select('saldo').eq('id',id).single(); await sb.from('usuarios').update({saldo:(u.saldo||0)+m}).eq('id',id); toast('+'+m+' CUP'); vAdmin(); }
async function aprobar(id){
  const {data:r}=await sb.from('recargas').select('*').eq('id',id).single(); if(!r||r.estado!=='pendiente') return;
  const {data:u}=await sb.from('usuarios').select('saldo').eq('id',r.repartidor_id).single();
  await sb.from('usuarios').update({saldo:(u.saldo||0)+Number(r.monto)}).eq('id',r.repartidor_id); await sb.from('recargas').update({estado:'aprobada'}).eq('id',id); vAdmin();
}
async function resp(id){ const t=prompt('Tu respuesta'); if(t) { await sb.from('soporte').update({respuesta:t,estado:'resuelto'}).eq('id',id); vAdmin(); } }
async function saveCfg(ev){ ev.preventDefault(); await sb.from('config').upsert(Object.entries(fd(ev.target)).map(([clave,valor])=>({clave,valor}))); await loadCfg(); toast('Guardado'); }

/* ---------- Arranque ---------- */
(async()=>{
  try{ await loadCfg(); await render(); hb(); }catch(er){ fail(er); }
  setInterval(hb,30000);
  setTimeout(()=>{ const s=document.getElementById('splash'); s.style.opacity=0; setTimeout(()=>s.remove(),400); },600);
})();
</script>
