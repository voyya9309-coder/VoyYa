const draw = h => { app.innerHTML=h; lucide.createIcons(); };
const toast = m => { const t=document.getElementById('toast'); t.textContent=m; t.classList.remove('hidden'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add('hidden'),3000); };
const skel = () => draw(`<div class="sk h-32 rounded-3xl mb-3"></div><div class="sk h-20 rounded-3xl mb-3"></div><div class="sk h-20 rounded-3xl"></div>`);

function unsub(){ chans.forEach(c=>sb.removeChannel(c)); chans=[]; if(M){ try{M.map.remove()}catch{} M=null; } }
function listen(name,table,filter,fn){ const c={event:'*',schema:'public',table}; if(filter)c.filter=filter; chans.push(sb.channel(name+Math.random()).on('postgres_changes',c,fn).subscribe()); }
const dist=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const gps=ok=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok(p.coords),()=>toast('Activa el permiso de ubicación'),{enableHighAccuracy:true,timeout:15000}):toast('Sin GPS en este teléfono');
function ding(){ try{ navigator.vibrate&&navigator.vibrate([200,100,200]); const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain(); o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.25,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.6);o.start();o.stop(a.currentTime+.6); }catch{} }
async function upd(t,id,o){ const {error}=await sb.from(t).update(o).eq('id',id); if(error){ toast('Error: '+error.message); return false; } return true; }

/* ---------- Sesión ---------- */
async function me(force){
  const id=localStorage.voyya_u; if(!id){U=null;return}
  if(U&&!force&&Date.now()-meT<20000) return;
  const {data,error}=await sb.from('usuarios').select('*').eq('id',id).maybeSingle();
  if(error) return; // sin conexión: se conserva la sesión
  meT=Date.now();
  if(!data||data.baneado||data.aprobado===false){ localStorage.removeItem('voyya_u'); U=null; if(data?.baneado) toast('Tu cuenta fue suspendida'); return; }
  U=data;
}
async function hb(){ // latido: marca "conectado" y cierra sesión si te banean o eliminan
  if(!U) return;
  const {error}=await sb.from('presencia').upsert({usuario_id:U.id,ultimo_visto:new Date().toISOString()});
  if(error){ if(error.code==='23503'){ localStorage.removeItem('voyya_u'); U=null; render(); } return; }
  const {data}=await sb.from('usuarios').select('baneado,aprobado').eq('id',U.id).maybeSingle();
  if(data&&(data.baneado||data.aprobado===false)){ localStorage.removeItem('voyya_u'); U=null; toast('Tu sesión terminó'); render(); }
}
function salir(){ localStorage.removeItem('voyya_u'); stopGPS(); U=null; go('cliente'); }
function head(){ document.getElementById('hr').innerHTML=(U?`<span class="text-xs text-white/70">${e(U.nombre)}</span><button onclick="salir()" class="text-xs underline text-white/70">Salir</button>`:'')+`<button onclick="U?go('soporte'):toast('Inicia sesión para escribir a soporte')" class="p-2 text-white" aria-label="Soporte"><i data-lucide="message-circle" class="w-5 h-5"></i></button>`; }

/* ---------- Registro / acceso (nombre, apellido, teléfono, tarjeta) ---------- */
function auth(rol,done){
  let reg=false; const R={cliente:'Cliente',negocio:'Dueño de negocio',repartidor:'Repartidor'};
  const draw1=()=>{
    draw(`<form class="${CARD} space-y-3"><div class="text-center"><img src="${IMG}" class="w-20 h-20 rounded-3xl object-cover mx-auto shadow-lg" alt=""><h2 class="font-black text-xl mt-2">${reg?'Crear cuenta':'Entrar'}</h2><p class="text-sm text-slate-500">${R[rol]}</p></div>`+
    (reg?`<input name="nombre" required placeholder="Nombre" class="${INP}"><input name="apellido" required placeholder="Apellido" class="${INP}">`:'')+
    `<input name="telefono" required inputmode="tel" placeholder="Número de teléfono" class="${INP}">`+
    (reg?`<input name="tarjeta" required inputmode="numeric" placeholder="Número de tarjeta" class="${INP}">`:'')+
    `<input name="clave" required type="password" placeholder="Clave (mínimo 4 caracteres)" class="${INP}">`+
    (reg&&rol==='negocio'?`<input name="negocio" required placeholder="Nombre del negocio" class="${INP}"><input name="categoria" placeholder="Categoría (pizzería, cafetería...)" class="${INP}"><input name="emoji" placeholder="Emoji 🍕" class="${INP}">`:'')+
    `<button class="${BTN} w-full">${reg?'Registrarme':'Entrar'}</button><button type="button" id="sw" class="text-sm underline text-slate-500 w-full">${reg?'Ya tengo cuenta':'No tengo cuenta: registrarme'}</button></form>`);
    app.querySelector('#sw').onclick=()=>{reg=!reg;draw1()};
    app.querySelector('form').onsubmit=async ev=>{
      ev.preventDefault(); const f=fd(ev.target), tel=f.telefono.replace(/\D/g,''), b=ev.target.querySelector('button'); let u; b.disabled=true;
      if(reg){
        const tj=f.tarjeta.replace(/\D/g,''); if(tel.length<8||tj.length<12||f.clave.length<4){ b.disabled=false; return toast('Revisa teléfono, tarjeta (12+ dígitos) y clave'); }
        const {data,error}=await sb.from('usuarios').insert({rol,nombre:f.nombre.trim(),apellido:f.apellido.trim(),telefono:tel,tarjeta:tj,clave:f.clave,aprobado:(rol==='cliente'&&CFG.aprobar_clientes!=='si')}).select().single();
        if(error){ b.disabled=false; return toast(error.code==='23505'?'Ese teléfono ya está registrado o no puede registrarse':'Error: '+error.message); }
        u=data; if(rol==='negocio') await sb.from('negocios').insert({dueno_id:u.id,nombre:f.negocio,categoria:f.categoria||'Tienda',emoji:f.emoji||'🏪'});
      } else {
        const {data}=await sb.from('usuarios').select('*').eq('telefono',tel).eq('clave',f.clave).maybeSingle();
        if(!data){ b.disabled=false; return toast('Teléfono o clave incorrectos'); }
        if(data.baneado){ b.disabled=false; return toast('Tu cuenta fue suspendida'); }
        if(rol!=='cliente'&&data.rol!==rol){ b.disabled=false; return toast('Esta cuenta es de '+data.rol); } u=data;
      }
      if(u.aprobado===false) return pend(u,done);
      localStorage.voyya_u=u.id; U=u; meT=Date.now(); hb(); done();
    };
  }; draw1();
}
function pend(u,done){
  unsub(); draw(`<div class="${CARD} text-center"><div class="text-5xl mb-2">⏳</div><h2 class="font-black text-lg">Cuenta pendiente de aprobación</h2><p class="text-slate-600 text-sm mt-1">El administrador revisará tu registro. Esta pantalla se actualiza sola cuando te aprueben.</p></div>`);
  listen('pd','usuarios',`id=eq.${u.id}`,p=>{ if(p.new?.aprobado&&!p.new.baneado){ localStorage.voyya_u=u.id; U=p.new; meT=Date.now(); hb(); toast('¡Cuenta aprobada!'); done(); } });
}

/* ---------- Mapa (Leaflet + OpenStreetMap) ---------- */
function mk(id){ const map=L2.map(id).setView([21.9322,-79.4428],12); L2.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map); return {map,m:{},n:0}; }
function pt(k,lat,lng,label,color){
  if(!M||lat==null||lng==null) return;
  if(M.m[k]) M.m[k].setLatLng([lat,lng]);
  else M.m[k]=L2.circleMarker([lat,lng],{radius:9,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).addTo(M.map).bindTooltip(label,{permanent:true,direction:'top'});
  const g=Object.values(M.m).map(x=>x.getLatLng());
  if(g.length!==M.n){ M.n=g.length; g.length>1?M.map.fitBounds(L2.latLngBounds(g),{padding:[40,40]}):M.map.setView(g[0],15); }
}

/* =================== CLIENTE =================== */
async function vCliente(){
  if(cv==='track'&&curTrack) return track(curTrack);
  if(cv==='neg'&&neg) return openNeg(neg.id);
  unsub(); skel();
  const load=async()=>{
    const [r1,r2]=await Promise.all([sb.from('negocios').select('*').eq('activo',true).order('nombre'),
      U?sb.from('pedidos').select('id,estado,total,negocios(nombre,emoji)').eq('cliente_id',U.id).order('creado',{ascending:false}).limit(6):Promise.resolve({data:[]})]);
    if(r1.error) return fail(r1.error); NEGS=r1.data; MIS=r2.data||[];
    if(tab==='cliente'&&cv==='home') drawHome();
  };
  listen('cn','negocios',null,load); if(U) listen('cp','pedidos',`cliente_id=eq.${U.id}`,load); load();
}

  const cats=[...new Set(NEGS.map(n=>n.categoria))];

  (CFG.pausa==='si'?`<div class="${CARD} mt-3 text-center font-bold">⏸️ Los pedidos están pausados por ahora. Vuelve en un rato.</div>`:'')+

}
function lst(){
  const box=document.getElementById('lst'); if(!box) return; const q=fq.toLowerCase();
  const r=NEGS.filter(n=>(!fc||n.categoria===fc)&&n.nombre.toLowerCase().includes(q));
  box.innerHTML=r.length?r.map(n=>{const ab=n.abierto!==false;return `<button onclick="openNeg('${n.id}')" class="${CARD} w-full flex items-center gap-4 mb-3 text-left active:scale-[.98] ${ab?'':'opacity-60'}"><span class="w-16 h-16 rounded-2xl bg-s flex items-center justify-center text-4xl">${e(n.emoji)}</span><span class="flex-1"><b class="block text-lg leading-tight">${e(n.nombre)}</b><span class="text-slate-500 text-sm">${e(n.categoria)}</span><br><span class="text-xs font-bold ${ab?'text-green-600':'text-red-600'}">● ${ab?'Abierto':'Cerrado'}</span></span><i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i></button>`}).join(''):`<div class="text-center text-slate-500 py-8"><div class="text-4xl">🔎</div>No hay negocios para mostrar</div>`;
  lucide.createIcons();
}
async function openNeg(id){
  cv='neg'; if(!neg||neg.id!=id) neg=NEGS.find(n=>n.id==id)||neg; if(!neg) return go('cliente');
  if(cart.nid!=id) cart={nid:id,items:{}};
  const load=async()=>{ const {data,error}=await sb.from('productos').select('*').eq('negocio_id',id).eq('disponible',true).order('nombre'); if(error) return fail(error); prods=data; if(tab==='cliente'&&cv==='neg'&&!CK.out) drawNeg(); };
  unsub(); listen('pr','productos',`negocio_id=eq.${id}`,load); load();
}
const cartTotal=()=>Object.values(cart.items).reduce((s,i)=>s+i.q*i.p.precio,0), cartCount=()=>Object.values(cart.items).reduce((s,i)=>s+i.q,0);
function chg(pid,d){ const p=prods.find(x=>x.id==pid), it=cart.items[pid]||{p,q:0}; it.q=Math.max(0,it.q+d); it.q?cart.items[pid]=it:delete cart.items[pid]; drawNeg(); }
function drawNeg(){
  CK.out=false; const cerrado=neg.abierto===false||CFG.pausa==='si';
  draw(`<button onclick="go('cliente')" class="font-bold mb-3 flex items-center gap-1"><i data-lucide="arrow-left" class="w-4 h-4"></i> Negocios</button>
  <div class="${CARD} flex items-center gap-4 mb-4"><span class="w-16 h-16 rounded-2xl bg-s flex items-center justify-center text-4xl">${e(neg.emoji)}</span><div><h2 class="text-xl font-black">${e(neg.nombre)}</h2><span class="text-sm text-slate-500">${e(neg.categoria)}</span></div></div>`+
  (cerrado?`<div class="${CARD} mb-3 text-center font-bold text-red-700">Cerrado por ahora: no se pueden hacer pedidos.</div>`:'')+
  (prods.length?prods.map(p=>{const q=cart.items[p.id]?.q||0;return `<div class="${CARD} mb-2 flex items-center gap-3 !p-3">
    ${p.foto?`<img src="${e(p.foto)}" loading="lazy" class="w-20 h-20 rounded-2xl object-cover">`:`<div class="w-20 h-20 rounded-2xl bg-s flex items-center justify-center text-3xl">${e(neg.emoji)}</div>`}
    <div class="flex-1"><b>${e(p.nombre)}</b><div class="font-black text-lg">${cup(p.precio)}</div></div>
    ${cerrado?'':`<div class="flex items-center gap-2">${q?`<button onclick="chg('${p.id}',-1)" class="w-9 h-9 rounded-full bg-black/10 font-bold">−</button><b>${q}</b>`:''}<button onclick="chg('${p.id}',1)" class="w-9 h-9 rounded-full bg-v text-vt font-bold">+</button></div>`}</div>`}).join(''):`<p class="text-slate-500 text-center py-6">Este negocio no tiene productos disponibles ahora.</p>`)+
  (cartCount()&&!cerrado?`<div class="fixed bottom-[4.5rem] inset-x-0 p-3 z-30"><div class="max-w-xl mx-auto"><button onclick="drawCheckout()" class="${BTN} w-full text-lg">Pedir ${cartCount()} · ${cup(cartTotal())}</button></div></div>`:''));
}
function drawCheckout(){
  CK.out=true; if(!U) return auth('cliente',drawCheckout);
  const km=(CK.lat!=null&&neg.lat!=null)?dist(neg.lat,neg.lng,CK.lat,CK.lng):null, envio=km==null?0:Math.max(Number(CFG.envio_min||0),Math.round(km*Number(CFG.tarifa_km))), sub=cartTotal();
  draw(`<button onclick="drawNeg()" class="font-bold mb-3 flex items-center gap-1"><i data-lucide="arrow-left" class="w-4 h-4"></i> Volver</button><h2 class="text-xl font-black mb-3">Tu pedido</h2>
  <div class="${CARD} mb-3">${Object.values(cart.items).map(i=>`<div class="flex justify-between"><span>${i.q} × ${e(i.p.nombre)}</span><span>${cup(i.q*i.p.precio)}</span></div>`).join('')}
  <div class="flex justify-between border-t mt-2 pt-2"><span>Productos</span><span>${cup(sub)}</span></div>
  <div class="flex justify-between"><span>Servicio a domicilio${km!=null?` (${km.toFixed(1)} km)`:''}</span><span>${km!=null?cup(envio):'con tu GPS se calcula'}</span></div>
  <div class="flex justify-between font-black text-xl"><span>Total</span><span>${cup(sub+envio)}</span></div>
  ${km==null&&neg.lat==null?`<p class="text-xs text-slate-500 mt-1">Este negocio aún no fijó su ubicación: el envío se acuerda con el repartidor.</p>`:''}</div>
  <form onsubmit="sendOrder(event,${envio},${km==null?'null':km})" class="space-y-3">
    <input name="dir" required oninput="CK.dir=this.value" value="${e(CK.dir)}" placeholder="Dirección con detalles (calle, número, referencias)" class="${INP}">
    <input name="nota" oninput="CK.nota=this.value" value="${e(CK.nota)}" placeholder="Nota para el negocio (opcional)" class="${INP}">
    <button type="button" onclick="gps(c=>{CK.lat=c.latitude;CK.lng=c.longitude;drawCheckout()})" class="${BTN2} w-full">📍 ${CK.lat!=null?'Ubicación enviada ✓ (actualizar)':'Enviar mi ubicación GPS'}</button>
    <button class="${BTN} w-full text-lg">Confirmar pedido</button></form>`);
}
async function sendOrder(ev,envio,km){
  ev.preventDefault(); if(CFG.pausa==='si') return toast('Los pedidos están pausados'); const b=ev.target.querySelector('button:last-child'); b.disabled=true; const sub=cartTotal(), f=fd(ev.target);
  const items=Object.values(cart.items).map(i=>({n:i.p.nombre,q:i.q,p:i.p.precio}));
  const {data,error}=await sb.from('pedidos').insert({cliente_id:U.id,negocio_id:neg.id,cliente_nombre:U.nombre+' '+U.apellido,cliente_tel:U.telefono,direccion:f.dir,nota:f.nota||null,lat:CK.lat,lng:CK.lng,items,subtotal:sub,envio,distancia_km:km==null?null:+km.toFixed(2),total:sub+envio,estado:'pendiente'}).select().single();
  if(error){ b.disabled=false; return toast('No se envió: '+error.message); }
  cart={nid:null,items:{}}; CK={lat:null,lng:null,dir:'',nota:''}; toast('¡Pedido enviado! 🎉'); track(data.id);
}
async function cancelarPed(id){ if(confirm('¿Cancelar este pedido?')&&await upd('pedidos',id,{estado:'cancelado'})) track(id); }
async function track(id){
  cv='track'; curTrack=id; neg=null; tab='cliente'; unsub();
  draw(`<button onclick="go('cliente')" class="font-bold mb-3 flex items-center gap-1"><i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al catálogo</button><div id="info"></div><div id="map" class="h-72 rounded-3xl mt-3 border border-black/10 overflow-hidden"></div>`);
  M=mk('map'); let locRep=null;
  const load=async()=>{
    const {data:p}=await sb.from('pedidos').select('*, negocios(nombre,emoji,lat,lng)').eq('id',id).maybeSingle();
    const info=document.getElementById('info'); if(!info) return; if(!p) return go('cliente');
    const steps=[['pendiente','Recibido','📥'],['preparando','Preparando','👨‍🍳'],['en_camino','En camino','🛵'],['entregado','Entregado','✅']];
    const idx=Math.max(0,steps.findIndex(s=>s[0]===(p.estado==='listo'?'preparando':p.estado)));
    info.innerHTML=`<div class="${CARD}"><h2 class="text-lg font-black">${e(p.negocios?.emoji)} ${e(p.negocios?.nombre)}</h2>
    <p class="text-sm text-slate-500 mb-3">${e(p.direccion)}<br>Productos ${cup(p.subtotal)} + envío ${cup(p.envio)} = <b>${cup(p.total)}</b></p>`+
    (['rechazado','cancelado'].includes(p.estado)?`<div class="text-center font-bold text-red-700">${L[p.estado]}</div>`:
     `<div class="flex justify-between">${steps.map((s,i)=>`<div class="flex-1 text-center"><div class="mx-auto w-11 h-11 rounded-full flex items-center justify-center text-xl ${i<=idx?'bg-v':'bg-black/10'}">${s[2]}</div><div class="text-[11px] mt-1 ${i===idx?'font-bold':'opacity-60'}">${s[1]}</div></div>`).join('')}</div>`+(p.estado==='listo'?`<p class="text-sm text-center text-slate-500 mt-2">Listo para recoger: buscando repartidor.</p>`:''))+
    (p.estado==='pendiente'?`<button onclick="cancelarPed('${p.id}')" class="${CHIP} w-full mt-3 text-red-700">Cancelar pedido</button>`:'')+`</div>`;
    pt('cli',p.lat,p.lng,'Tú','#2563eb'); pt('neg',p.negocios?.lat,p.negocios?.lng,p.negocios?.nombre||'Negocio','#f59e0b');
    if(p.repartidor_id&&p.estado==='en_camino'){
      if(locRep!==p.repartidor_id){ locRep=p.repartidor_id; listen('loc','ubicaciones',`repartidor_id=eq.${p.repartidor_id}`,load); }
      const {data:u}=await sb.from('ubicaciones').select('*').eq('repartidor_id',p.repartidor_id).maybeSingle(); if(u) pt('rep',u.lat,u.lng,'Repartidor','#dc2626');

async function setEst(id,est){ if(await upd('pedidos',id,{estado:est})) render(); }
async function toggAb(id,v){ if(await upd('negocios',id,{abierto:v})) render(); }

function setLoc(id){ gps(async c=>{ if(await upd('negocios',id,{lat:c.latitude,lng:c.longitude})){ toast('Ubicación guardada'); render(); } }); }
async function subir(file){ // comprime a 700 px / JPEG 70 % para conexiones lentas
  const img=await createImageBitmap(file), s=Math.min(1,700/Math.max(img.width,img.height)), c=document.createElement('canvas');
  c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.7)), n=`${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
  const {error}=await sb.storage.from('fotos').upload(n,b,{contentType:'image/jpeg'}); if(error) throw error;
  return sb.storage.from('fotos').getPublicUrl(n).data.publicUrl;
}
async function addProd(ev,nid){
  ev.preventDefault(); const f=ev.target, b=f.querySelector('button'); b.disabled=true; let foto=null;
  try{ const file=f.foto.files[0]; if(file) foto=await subir(file); }catch{ toast('No se pudo subir la foto'); }
  const {error}=await sb.from('productos').insert({negocio_id:nid,nombre:f.nombre.value,precio:+f.precio.value,foto}); if(error) toast(error.message); render();
}

function comprar(m){
  document.getElementById('pk').innerHTML=`<div class="mt-3 p-3 rounded-2xl bg-black/5 text-sm space-y-1"><b>Paquete ${cup(m)}</b><p>Transfiere a la tarjeta <b>${e(CFG.tarjeta||'(el admin aún no la configuró)')}</b></p><p>Teléfono: <b>${e(CFG.telefono||'—')}</b></p>

async function confirmarCompra(m){
  await sb.from('recargas').insert({repartidor_id:U.id,nombre:U.nombre+' '+U.apellido,telefono:U.telefono,monto:m});
  let n=(CFG.telefono||'').replace(/\D/g,''); if(n.length===8) n='53'+n;

async function tomar(id,saldo){
  if(saldo<Number(CFG.comision)) return toast('Saldo insuficiente: compra un paquete');
  const {data}=await sb.from('pedidos').update({repartidor_id:U.id,estado:'en_camino'}).eq('id',id).eq('estado','listo').is('repartidor_id',null).select();
  if(!data?.length) toast('Otro repartidor ya lo tomó');

async function entregar(id){
  const {data}=await sb.from('pedidos').update({estado:'entregado'}).eq('id',id).eq('estado','en_camino').select();
  if(data?.length){ const {data:u}=await sb.from('usuarios').select('saldo').eq('id',U.id).single(); await sb.from('usuarios').update({saldo:Math.max(0,(u.saldo||0)-Number(CFG.comision))}).eq('id',U.id); }
  stopGPS(); await sb.from('ubicaciones').delete().eq('repartidor_id',U.id); shownAct=null; toast('¡Entrega completada! ✅'); render();
}
function startGPS(me1,pid){ // watchPosition guarda la posición; cada 5 s se sube a Supabase
  if(watchId!==null) return; if(!navigator.geolocation) return toast('Sin GPS en este teléfono');
  watchId=navigator.geolocation.watchPosition(p=>{lastPos=p.coords},()=>toast('Activa el permiso de ubicación'),{enableHighAccuracy:true,maximumAge:5000});
  gpsTimer=setInterval(()=>{ if(!lastPos) return; pt('yo',lastPos.latitude,lastPos.longitude,'Tú','#dc2626');
    sb.from('ubicaciones').upsert({repartidor_id:me1,pedido_id:pid,lat:lastPos.latitude,lng:lastPos.longitude,actualizado:new Date().toISOString()}).then(()=>{}); },5000);
}
function stopGPS(){ if(watchId!==null) navigator.geolocation.clearWatch(watchId); clearInterval(gpsTimer); watchId=null; gpsTimer=null; lastPos=null; }

    <label class="text-sm font-semibold">Tu número de tarjeta (para recargas)<input name="tarjeta" value="${e(CFG.tarjeta)}" class="${INP}"></label>
    <label class="text-sm font-semibold">Tu teléfono / WhatsApp (con 53)<input name="telefono" value="${e(CFG.telefono)}" class="${INP}"></label>
    <label class="text-sm font-semibold">Aviso para todos (vacío = ninguno)<input name="aviso" value="${e(CFG.aviso)}" class="${INP}"></label>
    <label class="text-sm font-semibold">Aprobar clientes manualmente<select name="aprobar_clientes" class="${INP}"><option value="no" ${CFG.aprobar_clientes!=='si'?'selected':''}>No (entran solos)</option><option value="si" ${CFG.aprobar_clientes==='si'?'selected':''}>Sí (los apruebo yo)</option></select></label>
    <label class="text-sm font-semibold">Pausar pedidos<select name="pausa" class="${INP}"><option value="no" ${CFG.pausa!=='si'?'selected':''}>No</option><option value="si" ${CFG.pausa==='si'?'selected':''}>Sí, pausar todo</option></select></label>
    <label class="text-sm font-semibold">Tema de colores<select name="tema" class="${INP}">${Object.keys(TEMAS).map(k=>`<option ${k===CFG.tema?'selected':''}>${k}</option>`).join('')}</select></label>
    <button class="${BTN} w-full">Guardar ajustes</button></form>`;
  if(asec==='Actualizar'){
    const g=JSON.parse(localStorage.voyya_gh||'{}'), ref=new URL(SUPABASE_URL).hostname.split('.')[0];
    b=`<div class="${CARD} mb-4 space-y-2"><h3 class="font-black">🚀 Actualizar la página</h3><p class="text-xs text-slate-500">Versión instalada: ${VERSION}. Elige el nuevo index.html y se publica en tu GitHub Pages (tarda 1–2 min en verse).</p>
    <form onsubmit="subirPagina(event)" class="space-y-2"><input name="repo" required placeholder="usuario/repositorio" value="${e(g.repo||'')}" class="${INP}"><input name="tk" required type="password" placeholder="Token de GitHub" value="${e(g.tk||'')}" class="${INP}"><input name="file" required type="file" accept=".html" class="text-sm w-full"><button class="${BTN} w-full">Publicar actualización</button></form>
    <details class="text-xs text-slate-500"><summary class="font-bold">¿Cómo saco el token?</summary>GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token. Elige solo tu repositorio y en Permisos pon Contents: Read and write. El token se guarda solo en este teléfono.</details></div>
    <div class="${CARD} space-y-2"><h3 class="font-black">🗄️ Base de datos (SQL)</h3><p class="text-xs text-slate-500">Por seguridad la página no ejecuta SQL por sí sola. Aquí está el SQL actual: cópialo y pégalo en Supabase. También puedes cargar un archivo .sql nuevo.</p>
    <textarea id="sqlbox" rows="8" class="${INP} font-mono text-xs">${e(SQL_ACTUAL)}</textarea><input type="file" accept=".sql,.txt" onchange="cargarSql(this)" class="text-sm w-full">
    <div class="flex gap-2"><button onclick="copySql()" class="${BTN} flex-1">Copiar SQL</button><a target="_blank" rel="noopener" href="https://supabase.com/dashboard/project/${ref}/sql/new" class="${BTN2} flex-1 text-center">Abrir Supabase</a></div></div>`;
  }
  draw(`<div class="flex justify-between items-center mb-3"><h2 class="text-xl font-black">🛡️ Panel de administrador</h2><button onclick="ADM=false;go('cliente')" class="text-sm underline text-slate-500">Cerrar</button></div>
  <div class="flex gap-2 overflow-x-auto mb-3 pb-1">${AS.map(k=>`<button onclick="asec='${k}';vAdmin()" class="shrink-0 px-4 py-2 rounded-full text-sm font-bold ${k===asec?'bg-ink text-white':'bg-white border border-black/10 text-slate-900'}">${k}</button>`).join('')}</div><div id="adm">${b}</div>`);
}
/* Editor genérico: cualquier campo de cualquier fila */
async function ed(t,id){
  const {data:r}=await sb.from(t).select('*').eq('id',id).single(); if(!r) return; editing=true;
  document.getElementById('adm').innerHTML=`<form id="edf" class="${CARD} space-y-2"><h3 class="font-black">Editar (${t})</h3>`+Object.keys(r).filter(k=>k!=='id'&&k!=='creado').map(k=>{
    const v=r[k]; return `<label class="text-xs text-slate-500">${k}`+(typeof v==='boolean'?`<select name="${k}" class="${INP}"><option ${v?'selected':''} value="true">sí</option><option ${!v?'selected':''} value="false">no</option></select>`:`<input name="${k}" value="${e(v!==null&&typeof v==='object'?JSON.stringify(v):v)}" class="${INP}">`)+`</label>`;
  }).join('')+`<div class="flex gap-2"><button class="${BTN} flex-1">Guardar</button><button type="button" onclick="editing=false;vAdmin()" class="${CHIP} flex-1">Cancelar</button></div></form>`;
  document.getElementById('edf').onsubmit=async ev=>{
    ev.preventDefault(); const f=fd(ev.target), o={};
    try{ for(const k in f){ const v=f[k], t0=r[k]; o[k]=typeof t0==='boolean'?v==='true':typeof t0==='number'?(v===''?null:Number(v)):(t0!==null&&typeof t0==='object')?JSON.parse(v):(v===''?null:v); } }catch{ return toast('Formato inválido'); }
    const {error}=await sb.from(t).update(o).eq('id',id); if(error) return toast('Error: '+error.message); editing=false; toast('Guardado'); vAdmin();
  };
}
async function del(t,id){ if(!confirm('¿Eliminar definitivamente?')) return; const {error}=await sb.from(t).delete().eq('id',id); if(error) toast(error.message); vAdmin(); }
async function ban(id,v){ if(await upd('usuarios',id,{baneado:v})){ toast(v?'Usuario baneado':'Usuario desbaneado'); vAdmin(); } }
async function aprobarU(id){
  const {data:u}=await sb.from('usuarios').select('rol').eq('id',id).single();
  if(await upd('usuarios',id,{aprobado:true})){ if(u?.rol==='negocio') await sb.from('negocios').update({activo:true}).eq('dueno_id',id); toast('Cuenta aprobada ✔'); vAdmin(); }
}
async function togNeg(id,v){ if(await upd('negocios',id,{activo:v})){ toast(v?'Negocio aprobado ✔':'Negocio desactivado'); vAdmin(); } }
async function sal(id,m){ const {data:u}=await sb.from('usuarios').select('saldo').eq('id',id).single(); if(await upd('usuarios',id,{saldo:(u.saldo||0)+m})){ toast('+'+m+' CUP'); vAdmin(); } }
async function aprobar(id){
  const {data:r}=await sb.from('recargas').select('*').eq('id',id).single(); if(!r||r.estado!=='pendiente') return;
  const {data:u}=await sb.from('usuarios').select('saldo').eq('id',r.repartidor_id).single();
  if(await upd('usuarios',r.repartidor_id,{saldo:(u.saldo||0)+Number(r.monto)})){ await upd('recargas',id,{estado:'aprobada'}); toast('Saldo acreditado ✔'); vAdmin(); }
}
async function resp(id){ const t=prompt('Tu respuesta'); if(t&&await upd('soporte',id,{respuesta:t,estado:'resuelto'})) vAdmin(); }
async function saveCfg(ev){ ev.preventDefault(); const {error}=await sb.from('config').upsert(Object.entries(fd(ev.target)).map(([clave,valor])=>({clave,valor}))); if(error) return toast(error.message); await loadCfg(); toast('Guardado'); }
function cargarSql(i){ i.files[0]?.text().then(t=>{ document.getElementById('sqlbox').value=t; toast('SQL cargado'); }); }
function copySql(){ const t=document.getElementById('sqlbox'); (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('SQL copiado: pégalo en Supabase'),()=>{ t.select(); document.execCommand('copy'); toast('SQL copiado'); }); }
async function subirPagina(ev){
  ev.preventDefault(); const f=ev.target, b=f.querySelector('button'), repo=f.repo.value.trim(), tk=f.tk.value.trim(), file=f.file.files[0];
  const txt=await file.text(); if(!txt.includes('VoyYa')&&!confirm('Este archivo no parece ser VoyYa. ¿Publicar igual?')) return;
  b.disabled=true; b.textContent='Publicando…'; localStorage.voyya_gh=JSON.stringify({repo,tk});
  try{
    const h={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'}, u=`https://api.github.com/repos/${repo}/contents/index.html`;
    const cur=await fetch(u,{headers:h}); const sha=cur.ok?(await cur.json()).sha:undefined;
    const u8=new Uint8Array(await file.arrayBuffer()); let bin=''; for(let i=0;i<u8.length;i+=8192) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));
    const r=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify({message:'Actualización desde el panel de VoyYa',content:btoa(bin),sha})});
    if(!r.ok) throw new Error((await r.json()).message||r.status);
    toast('✅ Publicado. Se verá en 1–2 minutos: recarga la página.');
  }catch(er){ toast('No se pudo publicar: '+er.message); }
  b.disabled=false; b.textContent='Publicar actualización';
}

/* ---------- Arranque ---------- */
const L2 = window.L; // Leaflet (la constante L de arriba son los textos de estado)
(async()=>{
  try{ await loadCfg(); await render(); hb(); }catch(er){ fail(er); }
  setInterval(hb,30000);
  setInterval(async()=>{ if(tab==='admin'&&!editing){ if(asec==='Resumen') vAdmin(); else if(asec==='Usuarios'){ await loadPres(); document.querySelectorAll('[data-dot]').forEach(d=>{ d.className='inline-block w-3 h-3 rounded-full '+(online(d.dataset.dot)?'bg-green-500':'bg-slate-400'); }); } } },15000);
  setTimeout(()=>{ const s=document.getElementById('splash'); s.style.opacity=0; setTimeout(()=>s.remove(),450); },900);
})();
</script>
